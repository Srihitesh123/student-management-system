<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #1e3a5f;
        }

        .add-button {
            display: inline-block;
            background: #1769e0;
            color: white;
            padding: 11px 16px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #1e3a5f;
            color: white;
        }

        tr:hover {
            background: #f8fafc;
        }

        .edit-button, .delete-button {
            padding: 7px 10px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            color: white;
        }

        .edit-button {
            background: #198754;
        }

        .delete-button {
            background: #dc3545;
        }

        .delete-form {
            display: inline;
        }

        .empty-message {
            text-align: center;
            color: #666;
            padding: 25px;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Student Management System</h1>
    <p>Manage student records from one place.</p>

    <a th:href="@{/students/new}"
   class="add-button"
   sec:authorize="hasRole('ADMIN')">
    + Add New Student
</a>
<div style="background: white; padding: 20px; margin: 20px 0; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">

    <h3 style="margin-bottom: 15px;">Search Students</h3>

    <form th:action="@{/students}" method="get"
          style="display: flex; gap: 10px; flex-wrap: wrap;">

        <input type="text"
               name="keyword"
               th:value="${keyword}"
               placeholder="Search by name, roll number, or course..."
               style="flex: 1; min-width: 220px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 5px;">

        <button type="submit"
                style="background: #2563eb; color: white; border: none; padding: 12px 22px; border-radius: 5px; cursor: pointer;">
            Search
        </button>

        <a th:href="@{/students}"
           style="background: #64748b; color: white; padding: 12px 22px; border-radius: 5px; text-decoration: none;">
            Clear
        </a>

    </form>

</div>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Roll Number</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.rollNumber}"></td>
            <td th:text="${student.name}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.phone}"></td>
            <td th:text="${student.course}"></td>

            <td sec:authorize="hasRole('ADMIN')">
    <a th:href="@{/students/edit/{id}(id=${student.id})}"
       class="edit-button">Edit</a>

    <form th:action="@{/students/delete/{id}(id=${student.id})}"
          method="post"
          class="delete-form"
          onsubmit="return confirm('Are you sure you want to delete this student?');">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button type="submit" class="delete-button">
            Delete
        </button>
    </form>
</td>
<td sec:authorize="hasRole('USER')">
    View only
</td>
        </tr>

        <tr th:if="${#lists.isEmpty(students)}">
            <td colspan="7" class="empty-message">
                No students found. Click Add New Student to get started.
            </td>
        </tr>
        </tbody>
    </table>
    <!-- Pagination Controls -->
<div th:if="${totalPages > 1}"
     style="display: flex; justify-content: center; align-items: center;
            gap: 8px; flex-wrap: wrap; margin: 25px 0;">

    <!-- Previous Button -->
    <a th:if="${currentPage > 0}"
       th:href="@{/students(page=${currentPage - 1}, keyword=${keyword})}"
       style="padding: 9px 14px; background: #1e3a5f; color: white;
              text-decoration: none; border-radius: 5px;">
        Previous
    </a>

    <!-- Page Numbers -->
    <a th:each="pageNumber : ${#numbers.sequence(0, totalPages - 1)}"
       th:href="@{/students(page=${pageNumber}, keyword=${keyword})}"
       th:text="${pageNumber + 1}"
       th:style="${pageNumber == currentPage} ?
          'padding: 9px 14px; background: #2563eb; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;' :
          'padding: 9px 14px; background: #e2e8f0; color: #1e293b; text-decoration: none; border-radius: 5px;'">
    </a>

    <!-- Next Button -->
    <a th:if="${currentPage < totalPages - 1}"
       th:href="@{/students(page=${currentPage + 1}, keyword=${keyword})}"
       style="padding: 9px 14px; background: #1e3a5f; color: white;
              text-decoration: none; border-radius: 5px;">
        Next
    </a>

</div>

</div>
</body>
</html>
